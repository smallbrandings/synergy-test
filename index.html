<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>우리의 시너지 테스트</title>
  <style>
    :root{--blue:#699fce;--ink:#1d1d1f;--gray:#6e6e73;--line:#d5d5d7;--red:#cf6975}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;background:#edf0f2;color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}button{font:inherit}.app{width:402px;height:874px;padding:54px 34px 40px;background:#fff;box-shadow:0 0 0 1px #e4e6e8,0 12px 34px rgba(25,38,52,.12);overflow:hidden}.hidden{display:none!important}
    .intro{height:780px;display:flex;flex-direction:column}.intro h1{margin:75px 0 20px;color:#3287d0;font-size:29px;line-height:1.5;letter-spacing:-.065em}.intro p{margin:0;color:#4c4c50;font-size:13px;line-height:1.8;letter-spacing:-.04em}.intro p+p{margin-top:24px}.hero{width:202px;height:202px;margin:21px auto 37px;border-radius:50%;background:var(--blue);display:grid;place-items:center;overflow:hidden}.hero img{width:168px;height:168px;object-fit:contain;transform:translate(3px,8px)}.start-btn,.answer{border:0;cursor:pointer}.start-btn{width:166px;min-height:51px;margin:0 auto;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;box-shadow:0 2px 2px #d9e5ef}.duration{margin-top:23px!important;color:#79797e!important;font-size:11px!important;text-align:center}.start-btn:active,.answer:active,.action:active{transform:scale(.98)}
    .progress{height:9px;margin:32px 3px 0;border-radius:99px;background:#dedede;overflow:hidden}.progress i{display:block;height:100%;border-radius:inherit;background:var(--blue);transition:width .3s}.count{margin:11px 2px 0;text-align:right;color:#747479;font-size:13px}.question{margin:25px 2px 25px;font-size:26px;line-height:1.42;letter-spacing:-.07em;white-space:pre-line;word-break:keep-all}.answers{display:grid;gap:21px}.answer{min-height:182px;padding:23px 31px;border:1px solid #c9c9cb;border-radius:16px;background:#fff;text-align:left;transition:border .15s,box-shadow .15s}.answer strong{display:block;color:#3287d0;font-size:18px;line-height:1.5;letter-spacing:-.055em;white-space:pre-line;word-break:keep-all}.answer span{display:block;margin-top:14px;color:#69696d;font-size:14px;font-weight:400;line-height:1.62;letter-spacing:-.04em;word-break:keep-all}.answer.selected.good{border:4px solid var(--blue);padding:20px 28px}.answer.selected.bad{border:4px solid var(--red);padding:20px 28px}.feedback{margin-top:27px;padding:19px 16px;border-radius:14px;background:var(--blue);color:#fff;font-size:13px;line-height:1.55;letter-spacing:-.04em}.feedback.bad{background:var(--red)}
    .result{height:780px;display:flex;flex-direction:column}.result-top{display:flex;justify-content:space-between;margin-top:42px;color:#767679;font-size:11px;font-weight:800}.result h2{margin:37px 0 0;font-size:29px;line-height:1.55;letter-spacing:-.07em;white-space:pre-line}.actions{display:grid;gap:16px;margin:118px 26px 0}.action{min-height:61px;border:0;border-radius:4px;background:#1b1b1b;color:white;font-weight:800;font-size:16px;cursor:pointer}.thanks{margin-top:37px!important;color:#69696d!important;text-align:center;font-size:12px!important;line-height:2!important}@media(max-width:430px){body{display:block;min-height:0;background:#fff}.app{width:100%;height:100svh;min-height:0;padding:28px 34px 24px;box-shadow:none;border:0;overflow:hidden}.intro,.result{height:calc(100svh - 52px);min-height:0}.intro h1{margin-top:35px}.progress{margin-top:8px}.count{margin-top:8px}.question{margin-top:18px;margin-bottom:18px}.answers{gap:14px}.answer{min-height:182px;padding:22px 24px}.answer.selected.good,.answer.selected.bad{padding:19px 21px}.answer span{margin-top:12px}.feedback{margin-top:16px;padding:14px 15px}.result-top{margin-top:10px}.actions{margin-top:auto}.thanks{margin-top:22px!important}}@media(max-width:370px){.app{padding-left:28px;padding-right:28px}.intro h1{margin-top:24px}.question{font-size:24px}.answers{gap:12px}.answer{min-height:170px;padding:18px 20px}.actions{margin-top:45px}}
  </style>
</head>
<body><main class="app">
  <section id="intro" class="intro">
    <h1>우리가 함께한다면<br>어떤 시너지를 낼 수 있을까요?</h1>
    <p>이 테스트는 채용 전, 귀사의 업무 방식과 제가 잘 어울릴 수 있을지<br>가볍게 알아보기 위한 과정입니다.</p>
    <p>질문을 통해 서로의 업무 성향을 살펴보시고,<br>혹시 함께 이야기 나눠보고 싶다는 생각이 드신다면<br>편하게 연락 주시면 감사하겠습니다.</p>
    <div class="hero"><img src="high-five.png" alt="하이파이브하는 손"></div>
    <button class="start-btn" id="start">테스트 하기</button><p class="duration">총 10개의 질문이며, 1~2분 정도 소요됩니다.</p>
  </section>
  <section id="quiz" class="hidden"><div class="progress"><i id="bar"></i></div><div id="count" class="count"></div><h2 id="title" class="question"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"></div></section>
  <section id="result" class="result hidden"><div class="result-top"><span>TEST RESULT</span><span id="score"></span></div><h2 id="result-text"></h2><div class="actions"><button class="action" id="portfolio">Portfolio</button><button class="action" id="contact">Contact me</button></div><p class="thanks">소중한 시간을 내어 답해주셔서 감사합니다! 🙌<br>좋은 인연으로 함께 성장할 수 있기를 바랍니다.</p></section>
</main><script>
const qs=[
['우리 회사에 더 필요한 사람은\n어떤 유형인가요?',['혼자서도 잘해요!\n정해진 업무를 꼼꼼하게 수행해 줄 사람','개인 업무 비중이 많아요. 정해진 가이드에 맞춰 꼼꼼하게 처리해 줄 사람이면 좋겠어요.'],['우리 함께해요!\n협업과 소통이 자연스러운 사람','팀원들과 유연하게 협업할 일이 많아요. 소통하며 의견을 주고받는 사람이면 좋겠어요.'],'B','저는 함께 협력하여 결과물을 만들 때 더 큰 즐거움을 느껴요!'],
['새로운 직원은 문제를 어떻게\n해결하면 좋을까요?',['완벽한 계획부터!\n정해진 프로세스를 안정적으로 실행하는 사람','미리 정한 프로세스가 잘 마련되어 있어요. 그 흐름을 안정적으로 실행해 줄 사람이면 좋겠어요.'],['변화에도 유연하게!\n상황에 맞춰 해결책을 찾아가는 사람','예상치 못한 상황도 생길 수 있어요. 변화에 맞춰 해결책을 찾아갈 사람이면 좋겠어요.'],'B','저는 완벽한 계획보다, 문제가 생겼을 때 바로 해결해 나가는 편이에요.'],
['신입 직원은 어떤 방식으로\n업무를 배우게 되나요?',['탄탄한 매뉴얼부터!\n가이드에 따라 차근차근 배우는 방식','정해진 매뉴얼과 가이드가 준비되어 있어요. 순서대로 차근차근 업무를 익히면 돼요.'],['현장에서 함께!\n실무를 통해 빠르게 익히는 방식','실무를 함께하며 자연스럽게 배우게 돼요. 옆에서 보고 적용해 보는 방식이에요.'],'B','혼자 매뉴얼을 익히는 것보다, 옆에서 보고 적용하며 체득하는 방식을 좋아해요.'],
['새로운 직원은 어떤 방식으로\n업무를 풀어가면 좋을까요?',['기존 방식을 탄탄하게!\n익숙한 툴과 가이드를 지키는 사람','현재 사용하는 툴과 가이드가 있어요. 익숙한 방식 안에서 안정적으로 일하면 좋겠어요.'],['더 나은 방법을 찾아서!\n새로운 툴과 AI를 활용하는 사람','더 효율적인 방법이 있다면 시도해 볼 수 있어요. 새로운 툴과 AI 활용도 환영해요.'],'B','다양한 방법을 통해 최고의 효율을 내는 작업을 선호합니다.'],
['작업 과정의 피드백은\n어떻게 이루어지나요?',['바로바로 이야기해요!\n과정에서 자주 피드백을 나누는 방식','작업 중간중간 의견을 나누는 편이에요. 더 나은 결과를 위해 바로 개선해 나가요.'],['마무리 후 정리해요!\n프로젝트 후 종합 피드백을 주는 방식','프로젝트가 끝난 뒤 의견을 정리해 드려요. 다음 작업부터 적용할 수 있도록 안내해요.'],'A','성장을 위한 피드백이라면 언제든 환영합니다. 자주 들을수록 더 빠르게 적용할 수 있어요.'],
['새 직원이 오면 기업 문화도\n변화할 수 있을까요?',['함께 바꿔가요!\n직원 의견을 반영하며 발전하는 문화','새로운 구성원의 의견도 귀 기울여 들어요. 함께 더 좋은 방향으로 발전해 가면 좋겠어요.'],['기존의 결을 지켜요!\n조직의 방식에 적응하는 문화','오랫동안 쌓아 온 조직의 방식이 있어요. 그 안에 자연스럽게 적응해 주시면 좋겠어요.'],'A','직원의 의견도 반영된다면 더 즐겁게 일할 수 있을 것 같아요!'],
['우리 회사에 더 잘 맞는 인재는\n어떤 유형인가요?',['한 분야를 깊게!\n특정 프로그램에 능숙한 전문가','한 가지 분야를 깊이 있게 다루는 사람이 필요해요. 해당 프로그램의 전문성을 키워가면 좋겠어요.'],['다양하게 해내는!\n여러 업무를 유연하게 소화하는 올라운더','여러 업무를 함께 해내야 할 때가 많아요. 새로운 일을 배우고 유연하게 적용하는 사람이면 좋겠어요.'],'B','더 나은 결과물을 위해 여러가지를 배우고 적용하는 것을 좋아합니다.'],
['직원은 입사 후 어떤 모습으로\n성장하면 좋을까요?',['혼자서도 주도적으로!\n개인의 역량을 키워가는 성장','스스로 업무를 이끌 수 있는 역량을 키우면 좋겠어요. 개인의 성장을 더 중요하게 생각해요.'],['팀과 함께 더 크게!\n협업으로 시너지를 만드는 성장','팀원들과 맞춰가며 함께 성장하면 좋겠어요. 협업을 통해 팀 전체의 능률을 높이는 방식이에요.'],'B','팀원들과 시너지를 내며 함께 성장하는 것을 선호합니다.'],
['근무시간은 어떤 방식으로\n운영되나요?',['정해진 리듬대로!\n고정된 근무 시간을 지키는 방식','정해진 출퇴근 시간을 기준으로 운영해요. 안정적인 일상의 리듬을 중요하게 생각해요.'],['프로젝트에 맞춰 유연하게!\n상황에 따라 일정을 조율하는 방식','프로젝트 상황에 따라 일정을 조율할 수 있어요. 집중이 필요할 때 유연하게 맞춰가면 좋겠어요.'],'B','집중해야 할 때는 유연한 시간 운영도 중요하다고 생각해요.'],
['급여·업무 환경 의견은\n어떻게 반영되나요?',['성과와 의견을 함께 봐요!\n급여와 환경을 맞춰가는 방식','성과와 의견을 반영해 함께 조율해 가요. 더 좋은 업무 환경을 만들기 위해 노력해요.'],['정해진 기준을 우선해요!\n기존 운영 원칙을 따르는 방식','정해진 급여 기준과 운영 원칙이 있어요. 모든 구성원에게 같은 기준을 적용하는 방식이에요.'],'A','급여와 업무 환경 개선은 직원을 존중하고 오래 함께하기 위한 중요한 부분이라고 생각합니다.']];
let n=0,a=[],locked=false;const $=x=>document.getElementById(x);$('start').onclick=()=>{$('intro').classList.add('hidden');$('quiz').classList.remove('hidden');draw()};function draw(){let q=qs[n];$('bar').style.width=((n+1)/10*100)+'%';$('count').textContent=(n+1)+' / 10';$('title').textContent='Q'+(n+1)+'. '+q[0];$('feedback').className='feedback hidden';$('answers').innerHTML=['A','B'].map((k,i)=>`<button class="answer" data-k="${k}"><strong>${q[i+1][0]}</strong><span>${q[i+1][1]}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>pick(b));locked=false}function pick(b){if(locked)return;locked=true;let key=b.dataset.k,q=qs[n],good=key===q[3];a.push(key);b.classList.add('selected',good?'good':'bad');let f=$('feedback');f.textContent=(good?'😊 ':'🥲 ')+q[4];f.className='feedback '+(good?'':'bad');setTimeout(()=>{++n<10?draw():finish()},1600)}function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let s=a.filter((x,i)=>x===qs[i][3]).length;$('score').textContent='매칭점수 '+s+'점';$('result-text').textContent=s>=7?'우리가 함께한다면\n좋은 시너지를 낼 수\n있을 것 같아요 :)':s>=4?'매칭 점수는 아쉽지만,\n새로운 시선이 필요하거나\n더 적합한 직무가 있다면\n언제든 연락주세요 :)':'함께 일하는 방식이\n조금 다를 수 있지만,\n좋은 인연이 되길 바랍니다 :)'}$('portfolio').onclick=()=>alert('포트폴리오 주소를 연결해 주세요.');$('contact').onclick=()=>location.href='mailto:';
</script></body></html>
